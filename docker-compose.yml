services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: privatecoach
      POSTGRES_USER: privatecoach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-privatecoach_dev}
    volumes:
      - private_coach_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U privatecoach -d privatecoach"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://privatecoach:${POSTGRES_PASSWORD:-privatecoach_dev}@db:5432/privatecoach
      JWT_SECRET: ${JWT_SECRET:-replace-before-production}
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
    restart: unless-stopped
  frontend:
    build: .
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    depends_on: [backend]
    ports: ["3000:3000"]
    restart: unless-stopped
volumes:
  private_coach_data:
